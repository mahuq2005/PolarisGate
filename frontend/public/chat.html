<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolarisGate Chat</title>
<style>
  :root {
    --bg-primary: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-tertiary: #0f3460;
    --bg-input: #1a1a3e;
    --border: #2a2a4a;
    --text-primary: #e8e8f0;
    --text-secondary: #9090b0;
    --text-muted: #606080;
    --accent: #6c5ce7;
    --accent-hover: #7c6cf7;
    --danger: #e74c3c;
    --warning: #f39c12;
    --success: #27ae60;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden;
  }

  .app { display:flex; flex-direction:column; height:100vh; }

  /* ── Top Bar ────────────────────────────── */
  .topbar {
    height: 52px; padding: 0 20px; display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .topbar-left { display:flex; align-items:center; gap: 8px; }
  .topbar-logo { font-size:15px; font-weight:700; color:var(--accent); }
  .hamburger {
    background:none; border:none; color:var(--text-secondary); cursor:pointer;
    padding:6px; border-radius:6px; font-size:18px; line-height:1;
  }
  .hamburger:hover { background: rgba(255,255,255,0.05); }
  /* ── Provider dropdown in input area ────── */
  .provider-dropdown-wrap { display:flex; align-items:center; gap:4px; }
  /* Custom select base (shared) */
  .custom-select { position:relative; display:inline-block; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .custom-select-trigger { padding:10px 14px; border-radius:10px; border:1px solid rgba(79,142,247,0.12); background:#0B1120; color:#E2E8F0; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; transition:border-color 0.15s; }
  .custom-select-trigger:hover { border-color:rgba(79,142,247,0.25); }
  .custom-select.open .custom-select-trigger { border-color:rgba(79,142,247,0.35); }
  .custom-select .chevron { font-size:10px; color:#64748B; transition:transform 0.2s; }
  .custom-select.open .chevron { transform:rotate(180deg); }
  .custom-select-menu { position:absolute; top:calc(100% + 4px); left:0; right:auto; min-width:100%; background:#151F32; border:1px solid rgba(79,142,247,0.15); border-radius:10px; z-index:1000; max-height:240px; overflow-y:auto; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .custom-select.open .custom-select-menu { display:block; }
  .custom-option { padding:9px 14px; font-size:14px; color:#94A3B8; transition:all 0.12s; white-space:nowrap; cursor:pointer; }
  .custom-option:hover { background:rgba(79,142,247,0.1); color:#E2E8F0; }
  .custom-option.selected { color:#4F8EF7; font-weight:600; background:rgba(79,142,247,0.08); }
  /* Chat portal custom select override */
  .chat-custom-select { min-width: 110px; font-size:12px; }
  .chat-custom-select .custom-select-trigger { padding:6px 12px; font-size:12px; background:transparent; border-color:rgba(108,92,231,0.15); color:var(--text-secondary); border-radius:8px; }
  .chat-custom-select .custom-select-trigger:hover { border-color:var(--accent); }
  .chat-custom-select .custom-select-menu { background:var(--bg-secondary); border-color:var(--border); min-width:160px; }
  .chat-custom-select .custom-option { font-size:12px; padding:7px 14px; }
  .chat-custom-select .custom-option:hover { background:rgba(108,92,231,0.12); }
  .chat-custom-select .custom-option.selected { background:rgba(108,92,231,0.15); color:var(--accent); }
  .chat-custom-select .chevron { font-size:8px; }
  .topbar-right { display:flex; align-items:center; gap: 6px; }
  .btn-icon {
    background:none; border:none; color:var(--text-secondary); cursor:pointer;
    padding:5px 8px; border-radius:6px; font-size:13px;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.05); color:var(--text-primary); }

  /* ── Sidebar Drawer ─────────────────────── */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; display:none; }
  .drawer-overlay.open { display:block; }
  .sidebar-drawer {
    position:fixed; top:0; left:-280px; width:260px; height:100vh; z-index:100;
    background: var(--bg-secondary); border-right:1px solid var(--border);
    display:flex; flex-direction:column; transition:left 0.2s ease;
  }
  .sidebar-drawer.open { left:0; }
  .drawer-header { padding:14px 16px; border-bottom:1px solid var(--border); }
  .drawer-header .logo { font-size:16px; font-weight:700; color:var(--accent); }
  .drawer-header .tagline { font-size:11px; color:var(--text-muted); }
  .drawer-actions { padding:10px 14px; }
  .btn-new-chat {
    width:100%; background:var(--accent); color:#fff; border:none; padding:8px 12px;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:flex;
    align-items:center; gap:7px;
  }
  .btn-new-chat:hover { background:var(--accent-hover); }
  .btn-new-chat svg { width:14px; height:14px; }
  .conversations { flex:1; overflow-y:auto; padding:6px; }
  .conv-item {
    padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12px;
    color:var(--text-secondary); display:flex; align-items:center; gap:7px;
    margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .conv-item:hover { background:var(--border); }
  .conv-item.active { background:var(--bg-tertiary); color:var(--text-primary); }
  .conv-item .icon { font-size:13px; flex-shrink:0; }
  .drawer-footer { padding:10px 14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .drawer-footer .user-info { font-size:11px; color:var(--text-muted); }
  .drawer-footer .btn-logout {
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
    padding:3px 8px; border-radius:5px; font-size:10px; cursor:pointer;
  }
  .drawer-footer .btn-logout:hover { color:var(--danger); border-color:var(--danger); }

  /* ── Chat Area ──────────────────────────── */
  .chat-container {
    flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center;
  }
  .chat-messages {
    max-width: 768px; width:100%; padding: 24px 24px 0; flex:1 0 auto;
  }

  /* ── Welcome ────────────────────────────── */
  .welcome {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center; gap:8px; padding:40px 20px;
  }
  .welcome .icon { margin-bottom: 4px; opacity: 0.3; }
  .welcome h1 { font-size: 26px; font-weight: 600; letter-spacing:-0.3px; }
  .welcome p { font-size:13px; color:var(--text-muted); max-width:440px; line-height:1.5; }
  .welcome .suggestions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .welcome .suggestion {
    background:var(--bg-secondary); color:var(--text-secondary); border:1px solid var(--border);
    padding:9px 16px; border-radius:20px; font-size:13px; cursor:pointer; transition:all 0.15s;
    display:inline-flex; align-items:center; gap:4px;
  }
  .welcome .suggestion:hover { border-color:var(--accent); color:var(--text-primary); }

  /* ── Messages (flat text, no bubbles) ── */
  .msg-group {
    display:flex; gap:14px; padding: 18px 0; animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .msg-avatar {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:var(--accent);
    background:var(--bg-tertiary); align-self:flex-start; margin-top:1px;
  }
  .msg-group.user .msg-avatar { background:var(--accent); color:#fff; }
  .msg-body { flex:1; min-width:0; }
  .msg-body .role-label {
    font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:4px;
  }
  .msg-text {
    font-size:14px; line-height:1.75; white-space:pre-wrap; word-break:break-word;
    color:var(--text-primary);
  }
  .msg-group.user .msg-text { text-align:right; }
  .msg-meta {
    display:flex; align-items:center; gap:8px; margin-top:8px; font-size:11px; color:var(--text-muted);
  }
  .msg-group.user .msg-meta { flex-direction:row-reverse; }
  .safety-badge { padding:1px 7px; border-radius:6px; font-size:10px; font-weight:600; display:inline-flex; align-items:center; gap:3px; }
  .safety-badge.safe { background:rgba(39,174,96,0.1); color:var(--success); }
  .safety-badge.flagged { background:rgba(243,156,18,0.1); color:var(--warning); }
  .safety-badge.blocked { background:rgba(231,76,60,0.1); color:var(--danger); }
  .msg-group.error .msg-text { color:var(--danger); font-size:13px; }

  .typing-indicator { display:inline-flex; gap:4px; padding:2px 0; }
  .typing-indicator span { width:4px; height:4px; background:var(--text-muted); border-radius:50%;
    animation:typing 1.3s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay:0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay:0.3s; }
  @keyframes typing { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-4px);} }

  /* ── Input (larger, with attachment) ────── */
  .input-area { padding:12px 24px 32px; flex-shrink:0; display:flex; justify-content:center; }
  .input-wrapper {
    max-width:768px; width:100%; background:var(--bg-input);
    border:1px solid var(--border); border-radius:24px; padding:8px 8px 8px 20px;
    display:flex; flex-direction:column; gap:4px; transition:border-color 0.2s;
  }
  .input-wrapper:focus-within { border-color:var(--accent); box-shadow: 0 0 0 2px rgba(108,92,231,0.1); }
  .input-wrapper .input-row { display:flex; align-items:flex-end; gap:8px; }
  .input-wrapper textarea {
    flex:1; background:transparent; color:var(--text-primary); border:none;
    padding:6px 0; font-size:15px; resize:none; min-height:32px; max-height:180px;
    font-family:inherit; line-height:1.6; outline:none;
  }
  .input-wrapper textarea::placeholder { color:var(--text-muted); }
  .input-actions { display:flex; align-items:center; gap:6px; padding:0 0 4px 0; }
  .btn-attach {
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    padding:5px 8px; border-radius:8px; font-size:13px; display:flex; align-items:center;
    gap:4px; transition:all 0.15s;
  }
  .btn-attach:hover { background:var(--border); color:var(--text-primary); }
  .btn-attach svg { width:14px; height:14px; }
  .file-tag {
    display:inline-flex; align-items:center; gap:4px;
    background:rgba(108,92,231,0.12); color:var(--accent); padding:3px 10px;
    border-radius:12px; font-size:11px; font-weight:500;
  }
  .file-tag .remove {
    cursor:pointer; font-size:12px; line-height:1; opacity:0.6;
  }
  .file-tag .remove:hover { opacity:1; }
  .input-wrapper .send-btn {
    background:var(--accent); color:#fff; border:none; width:38px; height:38px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background 0.15s;
  }
  .input-wrapper .send-btn:hover { background:var(--accent-hover); }
  .input-wrapper .send-btn:disabled { background:var(--border); cursor:not-allowed; }
  #file-input { display:none; }

  /* ── Login ──────────────────────────────── */
  .login-overlay {
    position:fixed; inset:0; background:var(--bg-primary); display:flex; align-items:center;
    justify-content:center; z-index:1000;
  }
  .login-card {
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:16px;
    padding:36px 32px; width:380px; max-width:90vw; text-align:center;
  }
  .login-card .logo-icon { margin-bottom:6px; }
  .login-card h1 { font-size:20px; color:var(--text-primary); margin-bottom:2px; }
  .login-card p { color:var(--text-muted); font-size:12px; margin-bottom:20px; }
  .login-card input {
    width:100%; background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border);
    padding:10px 14px; border-radius:8px; margin-bottom:8px; font-size:13px; text-align:left;
  }
  .login-card input:focus { border-color:var(--accent); outline:none; }
  .login-card button {
    width:100%; background:var(--accent); color:#fff; border:none; padding:10px;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .login-card button:hover { background:var(--accent-hover); }
  .login-card .error { color:var(--danger); font-size:11px; margin-top:6px; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<div id="login-overlay" class="login-overlay">
  <div class="login-card">
    <div class="logo-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <h1>PolarisGate Chat</h1>
    <p>Enterprise AI with safety guardrails</p>
    <input type="email" id="login-email" placeholder="Email" value="admin@polarisgate.ai" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button onclick="handleChatLogin()">Login</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="chat-app" style="display:none;">
  <div class="app">
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <aside class="sidebar-drawer" id="sidebar-drawer">
      <div class="drawer-header">
        <div class="logo">PolarisGate</div>
        <div class="tagline">Enterprise AI Governance</div>
      </div>
      <div class="drawer-actions">
        <button class="btn-new-chat" onclick="newChat()">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>New Chat</span>
        </button>
      </div>
      <div class="conversations" id="conversations"></div>
      <div class="drawer-footer">
        <span class="user-info" id="sidebar-user"></span>
        <button class="btn-logout" onclick="handleChatLogout()">Logout</button>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleDrawer()" title="History">&#9776;</button>
        <span class="topbar-logo">PolarisGate</span>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" onclick="newChat()" title="New Chat">+</button>
      </div>
    </header>

    <div class="chat-container" id="chat-container">
      <div class="chat-messages" id="chat-messages">
        <div class="welcome">
          <div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <h1>How can I help you today?</h1>
          <p>Every message passes through safety guardrails for toxicity, PII, and prompt injection</p>
          <div class="suggestions">
            <button class="suggestion" onclick="sendSuggestion('Explain quantum computing in simple terms')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Explain quantum computing</button>
            <button class="suggestion" onclick="sendSuggestion('Write a professional email to schedule a meeting')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Write a meeting email</button>
            <button class="suggestion" onclick="sendSuggestion('Summarize the key principles of GDPR')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Summarize GDPR</button>
            <button class="suggestion" onclick="sendSuggestion('Compare REST and GraphQL APIs')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>REST vs GraphQL</button>
          </div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-row">
            <textarea id="chat-input" placeholder="Ask anything..." rows="1"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
              oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 6-12 6 3-6-3-6z" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="input-actions">
            <div class="provider-dropdown-wrap" id="provider-dropdown"></div>
            <span style="color:var(--text-muted);font-size:10px;margin:0 2px;">&middot;</span>
            <label class="btn-attach" for="file-input" title="Attach file">
              <svg viewBox="0 0 16 16" fill="none"><path d="M14.5 7.5l-8 8a4.5 4.5 0 01-6.36-6.36l8-8a3 3 0 014.24 4.24l-8 8a1.5 1.5 0 01-2.12-2.12l8-8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
              Attach
            </label>
            <input type="file" id="file-input" onchange="handleFileAttach(event)" accept=".txt,.md,.json,.csv,.py,.js,.ts,.html,.css,.yaml,.yml,.xml,.log,.sh,.sql,.env,.cfg,.ini">
            <span id="file-preview"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Relative path — nginx forwards /api/ to the gateway.
var API = '';
var chatToken = localStorage.getItem('pg-chat-token');
var currentProvider = 'ollama';
var conversations = [];
var serverConversations = [];
var activeConv = null;
var currentMessages = [];
var currentConvTitle = '';
var contextLimits = {};

if (chatToken) { showApp(); }
document.getElementById('login-password').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleChatLogin(); });
document.addEventListener('click', function(e) {
  var open = document.querySelector('.custom-select.open');
  if (open && !open.contains(e.target)) { open.classList.remove('open'); }
});
function toggleDrawer() {
  document.getElementById('sidebar-drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('sidebar-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

async function handleChatLogin() {
  var e = document.getElementById('login-error'); e.textContent = '';
  try {
    var fd = new URLSearchParams();
    fd.append('username', document.getElementById('login-email').value);
    fd.append('password', document.getElementById('login-password').value);
    var res = await fetch(API + '/auth/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:fd });
    if (!res.ok) throw new Error((await res.json().catch(function(){return{};})).detail || 'Login failed');
    chatToken = (await res.json()).access_token;
    localStorage.setItem('pg-chat-token', chatToken);
    showApp();
  } catch (err) { e.textContent = err.message; }
}

function showApp() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('chat-app').style.display = 'block';
  document.getElementById('sidebar-user').textContent = 'admin@polarisgate.ai';
  loadProviders();
  loadServerConversations();
  document.getElementById('chat-input').focus();
}

function handleChatLogout() {
  chatToken = null; localStorage.removeItem('pg-chat-token'); location.reload();
}

async function loadProviders() {
  try {
    var res = await fetch(API + '/api/v1/chat/providers', { headers:{ Authorization:'Bearer ' + chatToken } });
    if (!res.ok) throw new Error('Failed');
    var data = await res.json();
    var providers = data.providers || [];
    contextLimits = data.context_limits || {};
    currentProvider = providers.indexOf('ollama')>=0 ? 'ollama' : (providers.indexOf('mock')>=0 ? 'mock' : providers[0]);
    var opts = providers.map(function(p) { return {value:p, label:p.charAt(0).toUpperCase()+p.slice(1)}; });
    var html = '<div class="custom-select chat-custom-select" id="chat-provider-cs" onclick="event.stopPropagation();var el=document.getElementById(\'chat-provider-cs\');if(el.classList.contains(\'open\')){el.classList.remove(\'open\')}else{el.classList.add(\'open\')}"><div class="custom-select-trigger"><span class="cs-label">'+escapeHtml(currentProvider.charAt(0).toUpperCase()+currentProvider.slice(1))+'</span><span class="chevron">&#9660;</span></div><div class="custom-select-menu">'+opts.map(function(o){return '<div class="custom-option'+(o.value===currentProvider?' selected':'')+'" onclick="event.stopPropagation();document.getElementById(\'chat-provider-cs\').classList.remove(\'open\');document.querySelector(\'#chat-provider-cs .cs-label\').textContent=\''+escapeHtml(o.label).replace(/'/g,"\\'")+'\';onProviderChange(\''+o.value+'\');">'+escapeHtml(o.label)+'</div>';}).join('')+'</div></div>';
    document.getElementById('provider-dropdown').innerHTML = html;
  } catch(e) { document.getElementById('provider-dropdown').innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Unavailable</span>'; }
}

async function loadServerConversations() {
  try {
    var res = await fetch(API + '/api/v1/chat/conversations', { headers: { Authorization: 'Bearer ' + chatToken } });
    if (!res.ok) throw new Error('Failed');
    var data = await res.json();
    serverConversations = data.conversations || [];
  } catch(e) { serverConversations = []; }
  renderConversations();
}

function onProviderChange(val) { currentProvider = val; }

function newChat() {
  activeConv=null; currentMessages=[]; currentConvTitle='';
  renderConversations(); renderMessages(); closeDrawer();
  document.getElementById('chat-input').focus();
}

var attachedFile = null;
async function handleFileAttach(event) {
  var file = event.target.files[0];
  if (!file) return;
  attachedFile = file;
  document.getElementById('file-preview').innerHTML = '<span class="file-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2" style="vertical-align:middle"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg> '+escapeHtml(file.name)+' <span class="remove" onclick="removeFile()">&#10005;</span></span>';
}

function removeFile() {
  attachedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('file-preview').innerHTML = '';
}

function clearFile() { removeFile(); }

function selectServerConversation(idx) {
  if (idx < 0 || idx >= serverConversations.length) { newChat(); return; }
  var c = serverConversations[idx];
  activeConv = c.id;
  currentConvTitle = c.title;
  loadServerMessages(c.id);
  renderConversations();
  closeDrawer();
}

async function loadServerMessages(convId) {
  try {
    var res = await fetch(API + '/api/v1/chat/conversations/' + convId, { headers: { Authorization: 'Bearer ' + chatToken } });
    if (!res.ok) throw new Error('Failed');
    var data = await res.json();
    var msgs = data.messages || [];
    currentMessages = msgs.map(function(m) {
      var s = m.safety || {};
      return { role: m.role, content: m.content || '', time: m.created_at ? new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '', safety: { blocked: false, flagged: !!(s.toxic || s.pii_detected) } };
    });
  } catch(e) { currentMessages = []; }
  renderMessages();
}

function renderConversations() {
  var el = document.getElementById('conversations');
  if (serverConversations.length === 0) {
    el.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:11px;">No conversations yet</div>';
    return;
  }
  el.innerHTML = serverConversations.map(function(c){
    return '<div class="conv-item'+(c.id === activeConv ? ' active' : '')+'" onclick="selectServerConversation('+serverConversations.indexOf(c)+')">'
      + '<span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span><span>' + escapeHtml(c.title || 'Untitled') + '</span>'
      + '<span style="margin-left:auto;font-size:10px;color:var(--text-muted);cursor:pointer" onclick="deleteServerConversation(\''+c.id+'\',event)">&#10005;</span>'
      + '</div>';
  }).join('');
}

function renderMessages() {
  var el = document.getElementById('chat-messages');
  if (currentMessages.length===0) {
    el.innerHTML='<div class="welcome"><div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><h1>How can I help you today?</h1><p>Every message passes through safety guardrails for toxicity, PII, and prompt injection</p><div class="suggestions"><button class="suggestion" onclick="sendSuggestion(\'Explain quantum computing in simple terms\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Explain quantum computing</button><button class="suggestion" onclick="sendSuggestion(\'Write a professional email to schedule a meeting\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Write a meeting email</button><button class="suggestion" onclick="sendSuggestion(\'Summarize the key principles of GDPR\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Summarize GDPR</button><button class="suggestion" onclick="sendSuggestion(\'Compare REST and GraphQL APIs\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>REST vs GraphQL</button></div></div>';
    document.getElementById('chat-container').scrollTop=0; return;
  }
  el.innerHTML = currentMessages.map(function(m){
    var cls = m.role==='user' ? 'user' : (m.role==='error'?'error':'');
    var avatar = m.role==='user'?'U':(m.role==='error'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>':'AI');
    var html = '<div class="msg-group '+cls+'">';
    html += '<div class="msg-avatar">'+avatar+'</div>';
    html += '<div class="msg-body">';
    html += '<div class="msg-text">'+(m._typing?m.content:formatMessage(m.content))+'</div>';
    html += '<div class="msg-meta">';
    html += '<span>'+m.time+'</span>';
    if (m.safety) {
      if (m.safety.blocked) html += '<span class="safety-badge blocked">BLOCKED</span>';
      else if (m.safety.flagged) html += '<span class="safety-badge flagged">FLAGGED</span>';
      else if (!m._typing) html += '<span class="safety-badge safe"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Safe</span>';
    }
    if (m.provider) html += '<span style="margin-left:auto">'+m.provider+' &middot; '+m.model+'</span>';
    html += '</div></div></div>';
    return html;
  }).join('');
  var c = document.getElementById('chat-container'); if(c) c.scrollTop=c.scrollHeight;
}

function formatMessage(t) {
  var e = escapeHtml(t);
  e = e.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre style="background:rgba(0,0,0,0.25);padding:10px 14px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.5;margin:8px 0;border:1px solid var(--border)">$2</pre>');
  e = e.replace(/`([^`]+)`/g,'<code style="background:rgba(0,0,0,0.2);padding:1px 5px;border-radius:4px;font-size:12px;">$1</code>');
  e = e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return e;
}

function escapeHtml(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }
function sendSuggestion(t) { document.getElementById('chat-input').value=t; sendMessage(); }

async function sendMessage() {
  var input = document.getElementById('chat-input');
  var btn = document.getElementById('send-btn');
  var text = input.value.trim();
  if (!text || !currentProvider) return;
  input.value=''; input.style.height='auto'; btn.disabled=true;

  var now = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  currentMessages.push({role:'user',content:text,time:now});

  var tid = '@@t-'+Date.now();
  currentMessages.push({role:'assistant',content:'<div class="typing-indicator"><span></span><span></span><span></span></div>',time:now,_typing:tid});
  renderMessages();

  try {
    var historyMessages = [];
    var recentMsgs = currentMessages.filter(function(m){return m.role==='user'||m.role==='assistant';}).slice(-20);
    for (var i=0; i<recentMsgs.length; i++) {
      var rm = recentMsgs[i];
      if (rm.role==='user'||rm.role==='assistant') { historyMessages.push({role:rm.role==='assistant'?'assistant':'user',content:rm.content}); }
    }
    historyMessages.push({role:'user',content:text});

    if (attachedFile) {
      var fd = new FormData(); fd.append('file', attachedFile);
      try {
        var uploadRes = await fetch(API+'/api/v1/chat/upload', { method:'POST', headers:{Authorization:'Bearer '+chatToken}, body:fd });
        if (uploadRes.ok) {
          var uploadData = await uploadRes.json();
          var fileContent = uploadData.content || '';
          if (fileContent.length > 2000) fileContent = fileContent.substring(0, 2000) + '\n...(truncated)';
          historyMessages[historyMessages.length-1].content = '[File: '+escapeHtml(uploadData.filename)+']\n'+fileContent+'\n\n---\n'+text;
        }
      } catch(e) { console.error('File upload failed:', e); }
      removeFile();
    }

    var body = { provider: currentProvider, model: currentProvider==='ollama'?'llama3.2:1b':(currentProvider==='mock'?'mock':'') };
    if (activeConv && typeof activeConv === 'string') { body.conversation_id = activeConv; body.message = text; }
    else { body.message = text; }

    var res = await fetch(API+'/api/v1/chat/completions',{ method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+chatToken}, body:JSON.stringify(body) });
    currentMessages=currentMessages.filter(function(m){return m._typing!==tid;});
    if (!res.ok) {
      var err = await res.json().catch(function(){return{};});
      // 403 = safety block (injection/blocklist); 402 = budget exceeded. Anything
      // else (502 provider error, 500, etc.) is NOT a safety block — don't mislabel it.
      var blocked = res.status === 403 || res.status === 402;
      var msg = err.detail || (blocked ? 'Safety policy blocked this message' : 'Request failed (' + res.status + ')');
      currentMessages.push({role:'error',content:msg,time:now,safety:blocked?{blocked:true}:null});
    } else {
      var data = await res.json();
      var s = data.safety || {};
      var flagged = !!((s.input&&(s.input.toxic||s.input.pii_detected))||(s.output&&(s.output.toxic||s.output.pii_detected||s.output.blocklisted)));
      currentMessages.push({role:'assistant',content:data.text||'',time:now,safety:{blocked:false,flagged:flagged},provider:data.provider,model:data.model});
      if (data.conversation_id && !activeConv) { activeConv = data.conversation_id; loadServerConversations(); }
    }
  } catch(e) {
    currentMessages=currentMessages.filter(function(m){return m._typing!==tid;});
    currentMessages.push({role:'error',content:'Network error: '+e.message,time:now,safety:null});
  }
  renderMessages(); btn.disabled=false; input.focus();
}
</script>
